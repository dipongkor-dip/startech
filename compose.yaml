services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-startech} -d ${POSTGRES_DB:-postgres}" ]
      interval: 2s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 3s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 2s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"   
      - "15672:15672" 
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: always
    # 🛠️ আলপাইন ইমেজের জন্য সবচেয়ে নিরাপদ এবং ১০০% ওয়ার্কিং হেলথচেক (Netcat পোর্ট চেকার)
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 5672 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
    volumes:
      - ./frontend:/app
    depends_on:
      - user
    command: sh -c "CI=true pnpm install --no-frozen-lockfile && pnpm exec next dev --hostname 0.0.0.0 --port 3000"

  user:
    build:
      context: ./backend/user
      dockerfile: Dockerfile
    ports:
      - "5003:5003"
    env_file:
      - .env
    environment:
      PORT: 5003
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/user:/app
      - ./backend/user/node_modules:/app/node_modules
      - ./backend/user/.pnpm-store:/app/.pnpm-store
      - ./backend/user/logs:/app/logs
    command: sh -c "CI=true pnpm install --no-frozen-lockfile && pnpm db:migrate && pnpm dev"

  product:
    build:
      context: ./backend/product
      dockerfile: Dockerfile
    ports:
      - "5004:5004"
    env_file:
      - .env
    environment:
      PORT: 5004
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend/product:/app
      - ./backend/product/node_modules:/app/node_modules
      - ./backend/product/.pnpm-store:/app/.pnpm-store
      - ./backend/product/logs:/app/logs
    command: sh -c "CI=true pnpm install --no-frozen-lockfile && pnpm dev"

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  rabbitmq_data: