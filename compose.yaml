  user:
    build:
      context: ./backend/user
      dockerfile: Dockerfile
    ports:
      - "5003:5003"
    env_file:
      - .env
    environment:
      PORT: 5003
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/user:/app
      - ./backend/user/node_modules:/app/node_modules
      - ./backend/user/.pnpm-store:/app/.pnpm-store
      - ./backend/user/logs:/app/logs
    command: sh -c "CI=true pnpm install --no-frozen-lockfile && pnpm db:migrate && pnpm dev"

